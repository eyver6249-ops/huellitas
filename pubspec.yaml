name: tecniya
description: Huellitas - app para reportar mascotas perdidas con GPS y evidencia fotográfica.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^13.0.1
  image_picker: ^1.1.2
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  connectivity_plus: ^6.0.5
  url_launcher: ^6.3.0
  uuid: ^4.5.1
  supabase_flutter: ^2.8.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icono_app.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icono_app.png"
  adaptive_icon_background: "#E8743B"
  adaptive_icon_foreground: "assets/icono_fg.png"
